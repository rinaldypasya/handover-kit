name: handover-kit check

on:
  pull_request:

permissions:
  contents: read
  issues: write # needed to post the drift comment on the PR

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g handover-kit
      - run: handoverkit check --ci --post-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
